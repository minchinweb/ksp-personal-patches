// MEV Heavy Industries

// (Attempt at) adding SystemHeat support
// Updated: William Minchin, 2026-05-16
// 
// Known Issues:
//  - need to set throttle to "Independant" (and increase) in VAB to see engine heat generation
//  - doesn't seem to generation any heat on duel mode engines (and sets loop temperature to 3K)


// per https://projectrho.com/public_html/rocket/torchships.php
// Tungston (for the drive bell) melts at 3695K, but we generally want to keep
//      it below 3000K.
// Expect ~1% of waste heat to be absorbed by the bell and disappated elsewhere.
// At 3000K, the bell itself will radiate 4.6 MW/m2 of heat as thermal radiation.

// radiation key follows the 4th power of surface temperature
//
//        temperatureCurve
//        {
//            key = 0    0
//            key = 600  0.0016
//            key = 1200 0.0256
//            key = 1800 0.1296
//            key = 2400 0.4096
//            key = 3000 1
//            key = 3700 2.3138
//        }

// Isp = Ve / G0  (Ve is exhauast velocity, G0 is gravitational acceleration on earth at sea levle, of 9.81 m/s2)
// Watts = Ve * Thrust / 2
// Watts = G0 * Isp * Thurst / 2
// (get Isp from "atmosphereCurve", get Thrust from "maxThrust")
// (assumes Vacuum)


// remove CoreHeat productions
@PART[BussardFusion,DaedalusDrive,EpsteinDrive,EpsteinDriveV4]:NEEDS[SystemHeat]:FOR[MEVFusionTek] {
    // remove core heat modules
    !MODULE[ModuleCoreHeat] {}
    !MODULE[ModuleOverheatDisplay] {}
    !TemperatureModifier {}

    @MODULE[ModuleEngines*],*
    {
        @heatProduction = 0
    }
}

@PART[BussardFusion]:NEEDS[SystemHeat]:FOR[MEVFusionTek] {
    // add system heat main module
    MODULE
    {
        name = ModuleSystemHeat
        // Cubic metres of coolant
        // assumes 5cm thick outer cylinder at bell width (10m) and 3.0m tall
        volume = 9.401
        moduleID = engine
        iconName = Icon_Engine
    }

    MODULE
    {
        name = ModuleSystemHeatEngine
        // must be unique
        moduleID = engine
        // ModuleSystemHeat to link to
        systemHeatModuleID = engine
        //engineModuleID = ReactionProducts
        engineModuleID = FissionFragment
        // in KW at peak output
        // 9.81 * 2700000 * 1080 / 2 / 1000 (Kw/W) * 0.01
        systemPower = 143029  // ~14 GW raw
        //systemPower = 715  // heatProduction = 200

        // Nominal system output temperature
        systemOutletTemperature = 1800  // drop from 3000 until really high temp radiators exist in game
        // Valid system temperature range
        temperatureCurve
        {
            key = 0 0
            key = 300 1.0
            key = 3000 1.0
            key = 3700 0.0
        }
    }

    // would radiate 433,320 kW of thermal heat at 3000K?
    MODULE
    {
        name = ModuleSystemHeatRadiator
        moduleID = radiator
        systemHeatModuleID = engine
        temperatureCurve
        {
            key = 0          0
            key = 600      693
            key = 1200   11092
            key = 1800   56158
            key = 2400  177488
            key = 3000  433320
            key = 3700 1002594
        }
        
        scalarModuleID = heat
        maxTempAnimation = 3750
        maxRadiatorTemperature = 3000
        emissivity = 0.9
        convectiveArea = 94.2
    }
}

