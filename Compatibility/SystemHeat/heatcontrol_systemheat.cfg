// Make HeatControl's "Heat Exchangers" usable as SystemHeat heat exchangers
// Author: William Minchin, 2026-05-05


@PART[heat-exchanger-125-1]:NEEDS[SystemHeat]:FOR[HeatControl]
{
    MODULE
    {
        name = ModuleSystemHeat
        // Cubic metres
        volume = 1.4
        moduleID = loop1
        iconName = Icon_Exchanger
        currentLoopID = 0
    }
    
    MODULE
    {
        name = ModuleSystemHeat
        // Cubic metres
        volume = 1.4
        moduleID = loop2
        iconName = Icon_Exchanger
        currentLoopID = 1
    }

    MODULE
    {
        name = ModuleSystemHeatExchanger
        moduleID = sink
        systemHeatModuleID1 = loop1
        systemHeatModuleID2 = loop2

        ToggleSource = true

        HeatRate = 0
        OutletAdjustment = 0

        // Maps change in temperature to heat generated
        temperatureDeltaHeatCurve
        {
            key = -2000 400
            key = 0 0  
            key = 2000 400
        }

        // Maps change in temperature to power cost
        temperatureDeltaCostCurve
        {
            key = -2000 200
            key = 0 0  
            key = 2000 200
        }

        // Maps desired heat flow to power scale
        heatFlowCostCurve
        {
            key = -1000 1000
            key = 0 0
            key = 1000 1000
        }
    }
}



