// https://github.com/post-kerbin-mining-corporation/StationPartsExpansionRedux/pull/342

// Author: MinchinWeb
// Increases the interaction range on the 3.75m greenhouse and fishfarm to
// 4.0m.


@PART[sspx-aquaculture-375-1]:NEEDS[StationPartsExpansionRedux]
{
    @MODULE[ModuleScienceExperiment]
    {
        %interactionRange = 4.0
    }
}


@PART[sspx-greenhouse-375-1]:NEEDS[StationPartsExpansionRedux]
{
    @MODULE[ModuleScienceExperiment]
    {
        %interactionRange = 4.0
    }
}
