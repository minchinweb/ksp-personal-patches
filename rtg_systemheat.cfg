// downloaded from: https://github.com/munktron239/Munks-Fixes/blob/main/Random-patches-2/experimental-fix-systemheat-rtg.cfg

// give the stock rtg ModuleSystemHeat

@PART[rtg]:HAS[@MODULE[ModuleCoreHeat]]:NEEDS[SystemHeat]:FOR[ksp-personal-patches]
{
	!MODULE[ModuleCoreHeat] {}
	MODULE
	{
		name = ModuleSystemHeat
		volume = 0.09			// part volume = 90 liters
		moduleID = reactor
		iconName = Icon_Nuclear
		ignoreTemperature = true
	}
}
